<script type="text/javascript">

var RANK = {
 _uin : 0,
 _total_page : 1,
 _cur_page : 1,
 _pagenum : 10,
 _type : 0,
 _data : undefined,
 _rank : [],
 _memo : {},
 sCurNick : '',
 _bIsFromQzone : false,
 init : function(){
  if( !CARD.checkLogin() ) {
   CARD.showLogin();
   return;
  }
  CARD.data.init();
  CARD.setMiniName();
  if (1 != CARD.getCookie("cardsrc")){
   RANK._bIsFromQzone = false;
  }
  else{
   RANK._bIsFromQzone = true;
  }
  
  RANK.getMemo();
 },
 showCollec: function(uin,nick){
  RANK.sCurNick = nick;
  CARD.showFriendCollec(uin,nick,0);
 },
 getMemo : function(){

  RANK._uin = qsns.getLoginUin() || RANK._uin;
  var sUrl = 'https://card.qzone.qq.com/cgi-bin/card_user_memo?src=2&uin='+RANK._uin;
  CARD.getScript( sUrl, RANK._callBack_ , 'UTF-8', true); 
  var _bQzone = location.hash.indexOf("qz_ver")>-1  ? 1 : 0;
  if(_bQzone != 1)
  {
   if(RANK._iUin){
    $("P_LOGIN").style.display = "none";
    $("STR_NOLOGIN").style.display = "none";
    $("P_UNLOGIN").style.display = "";
    $("STR_LOGIN").style.display = "";
   }
   else{
    $("P_LOGIN").style.display = "";
    $("P_UNLOGIN").style.display = "none";
    $("STR_NOLOGIN").style.display = "";
    $("STR_LOGIN").style.display = "none";
   }
  }
 },

 GetMemoCallback :function(iCode,oData){
  if( iCode != 0 ){
   if( iCode == -1001 )
   {
    CARD.showLogin();
    return;
   }
  }
  else{
   var oMemodata = oData.data;
   var ex = /^ {0,}$/g;
   for (var i=0, len=oMemodata.length; i<len; i++){
    //若备注为空字符串，则显示昵称
    if(!ex.test(oMemodata[i].memo)){
     RANK._memo[oMemodata[i].ui] = oMemodata[i].memo;
    }
   }
  }

  RANK._uin = qsns.getLoginUin() || RANK._uin;
  RANK.getRank( 1,0 );
 },

 _callback_ : function( iCode,oData ){

  if( iCode != 0 ){
   if( iCode == -1005 )
   {
    CARD.showReg();
   }
   else if(iCode == -50001)//防雪蹦
   {
    CARD.CRASH.crashProof();
   }
   return;
  }
  this._total_page = Math.ceil( oData.pall/RANK._pagenum );
  this._data = oData;
  if( RANK._type == 0 )
   this.showScoreRank( RANK._cur_page );
  else
   this.showGoldRank( RANK._cur_page );
   
  //this.showHead( oData.user );

 },
 getRank : function( page, type ){
  RANK._type = type;
  RANK._cur_page = page;
  var url = "https://card.qzone.qq.com/cgi-bin/card_rank_get?pno=" + page + "&pnum=" + RANK._pagenum + "&type=" + type;
    
  //CARD.getScript( url, 'UTF-8', RANK._callBack_ );
  CARD.getScript( url, RANK._callBack_ , 'UTF-8', true); 
 },
 showHead : function( data ){
  if( data === null )
   return;

  var arr = [];
  arr.push([data.ui,data.ni,data.ca,data.sc]);

  var oLv;
  var mapName = [
   [0,'<%uin%>'],
   [1,'<%nick%>',function(v){return v.replace(/\r\n/g,'').replace(/\r/g,'').replace(/\n/g,'').escHtml();}],
   [2,'<%cash%>'],
   [3,'<%score%>',function(v){
    oLv = CARD.LEVEL.getLevel(v);
    if( oLv.lv >= 50 )
     return '已满级';
    return oLv.score+'/'+oLv.need;
   }],
   [3,'<%lv%>',function(v){return oLv.lv;}],
   [3,'<%percent%>',function(v){return oLv.rate;}]
  ];
  
  var tmplt = $('ID_TEMPLETE').innerHTML.between("<!--TPL.USERINFO","TPL.USERINFO-->");
  showCardData( arr, $("ul_user_info"), tmplt, mapName );
 },

 //排行榜的map
 rankMap : [
   [0,'<%uin%>'],
   [1,'<%nick%>',function(v){return v.replace(/\r\n/g,'').replace(/\r/g,'').replace(/\n/g,'').escHtml();}],
   [1,'<%url_nick%>',function(v){return (""+escape(v)).escUrl();}],
   [2,'<%cash%>'],
   [3,'<%score%>'],
   [3,'<%lv%>',function(v){return CARD.LEVEL.getLevel(v).lv;}],
   [5,'<%i%>'],
   [5,'<%lv_class%>',function(v){var i=(v%10)==0?(10):(v%10); return v<=3?('level_a zindex'+i):('level_d zindex'+i);}]
  ],

 showGoldRank : function( page ) {
  //var beg = new Date();
  RANK._cur_page = page || 1;
  var arr = [], d = RANK._data.data;
  for( var i=0; i<d.length; i++ ){
   var sName;
   //自己的备注不显示
   if (RANK._memo[ d[i].ui] && (RANK._uin != d[i].ui)){
    sName = RANK._memo[ d[i].ui];
   }
   else{
    sName = d[i].ni;
   }
   arr.push( [ d[i].ui, sName, d[i].ca, d[i].sc, d[i].thl, d[i].no ] );
  }
  function mySort(a,b){
   return b[2] - a[2];
  }
  arr = arr.sort(mySort);
  var tmplt;
  tmplt = $('ID_TEMPLETE').innerHTML.between("<!--TPL.RANK","TPL.RANK-->");

  showCardData( arr, $("ID_OL_GOLD_RANK"), tmplt, RANK.rankMap );
  
  var oClasses = {parent:"mod_pagenav",active:"current",input:"textinput",pagemain:"mod_pagenav_main",prev:"mod_pagenav_disable",prevdis:"mod_pagenav_disable desc", next:"mod_pagenav_disable",nextdis:"mod_pagenav_disable desc",random:"mod_pagenav_option",turn:"mod_pagenav_turn"};
  QSFL.excore.showQQSHOWPage(RANK._cur_page, RANK._total_page, function(n){return "javascript:RANK.getRank("+n+",1);";}, $("ID_DIV_GOLD_PAGE"), null, oClasses);

  try{
   $("ID_DIV_GOLD_PAGE").getElementsByTagName('BUTTON')[0].className = 'bt_tx2';
   $("ID_DIV_GOLD_RANK").style.display = "";
   $("ID_DIV_SCORE_RANK").style.display = "none";
  }catch(e){}
  scrollTo(0,0);

  //alert( new Date() - beg );
 },
 getThemeName : function( themeid ){
  for( var i =0; i<theme_card_list.length; i++ ){
   if( theme_card_list[i][0] == themeid ){
    return theme_card_list[i][1];
   }
  }
 },
 getThemeIndex : function( themeid ){
  var i = 0;
  for( ; i<theme_card_list.length; i++ ){
   if( theme_card_list[i][0] == themeid ){
    return i;
   }
  }
  return -1;
 },
 showScoreRank : function( page ){

  RANK._cur_page = page || 1;
  var arr = [], d = RANK._data.data;
  for( var i=0; i<d.length; i++ ){
   var sName;
   //自己的备注不显示
   if (RANK._memo[ d[i].ui] && (RANK._uin != d[i].ui)){
    sName = RANK._memo[ d[i].ui];
   }
   else{
    sName = d[i].ni;
   }
   arr.push( [ d[i].ui, sName, d[i].ca, d[i].sc, d[i].thl, d[i].no ] );
  }
  
  function mySort(a,b){
   return b[3] - a[3];
  }
  arr = arr.sort(mySort);
  
  var tmplt;
  tmplt = $('ID_TEMPLETE').innerHTML.between("<!--TPL.RANK","TPL.RANK-->");
  showCardData( arr, $("ID_OL_SCORE_RANK"), tmplt, RANK.rankMap );
