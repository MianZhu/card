	function getBrowser()
	{
		var UserAgent = navigator.userAgent.toLowerCase();
		var browserInfo = {};
		var browserArray = {
			IE: window.ActiveXObject || "ActiveXObject" in window, // IE
			Chrome: UserAgent.indexOf('chrome') > -1 && UserAgent.indexOf('safari') > -1, // Chrome浏览器
			Firefox: UserAgent.indexOf('firefox') > -1, // 火狐浏览器
			Opera: UserAgent.indexOf('opera') > -1, // Opera浏览器
			Safari: UserAgent.indexOf('safari') > -1 && UserAgent.indexOf('chrome') == -1, // safari浏览器
			Edge: UserAgent.indexOf('edge') > -1, // Edge浏览器
			QQBrowser: /qqbrowser/.test(UserAgent), // qq浏览器
			WeixinBrowser: /MicroMessenger/i.test(UserAgent) // 微信浏览器
		};
		// console.log(browserArray)
		for (var i in browserArray)
		{
			if (browserArray[i])
			{
				var versions = '';
				if (i == 'IE')
				{
					versions = UserAgent.match(/(msie\s|trident.*rv:)([\w.]+)/)[2];
				}
				else if (i == 'Chrome')
				{
					for (var mt in navigator.mimeTypes)
					{
						//检测是否是360浏览器(测试只有pc端的360才起作用)
						if (navigator.mimeTypes[mt]['type'] == 'application/360softmgrplugin')
						{
							i = '360';
						}
					}
					versions = UserAgent.match(/chrome\/([\d.]+)/)[1];
				}
				else if (i == 'Firefox')
				{
					versions = UserAgent.match(/firefox\/([\d.]+)/)[1];
				}
				else if (i == 'Opera')
				{
					versions = UserAgent.match(/opera\/([\d.]+)/)[1];
				}
				else if (i == 'Safari')
				{
					versions = UserAgent.match(/version\/([\d.]+)/)[1];
				}
				else if (i == 'Edge')
				{
					versions = UserAgent.match(/edge\/([\d.]+)/)[1];
				}
				else if (i == 'QQBrowser')
				{
					versions = UserAgent.match(/qqbrowser\/([\d.]+)/)[1];
				}
				browserInfo.type = i;
				browserInfo.versions = versions;
			}
		}
		return browserInfo;
	}
	function getBrowserType(browserName)
	{
		if(browserName == "IE")
		{
			return 1;
		}
		else if(browserName == "Chrome")
		{
			return 2;
		}
		else if(browserName == "Firefox")
		{
			return 3;
		}
		else if(browserName == "Opera")
		{
			return 4;
		}
		else if(browserName == "Safari")
		{
			return 5;
		}
		else if(browserName == "Edge")
		{
			return 6;
		}
		else if(browserName == "QQBrowser")
		{
			return 7;
		}
		else if(browserName == "WeixinBrowser")
		{
			return 8;
		}
		else if(browserName == "360")
		{
			return 9;
		}
		return 0;
	}
	function getFlashVersion()
	{
     var flashVer = null;
     var ua = navigator.userAgent;
 
     if (window.ActiveXObject)
	 {
         var swf = new ActiveXObject('ShockwaveFlash.ShockwaveFlash');
 
         if(swf)
		 {
			console.log("kubi getFlashVersion1 : " + swf.GetVariable('$version'));
             flashVer = parseFloat(swf.GetVariable('$version').split(' ')[1].replace(/,/g, '.').replace(/^(d+.d+).*$/, "$1"));
         }
     }
	 else
	 {
         if (navigator.plugins && navigator.plugins.length > 0)
		 {
             var swf = navigator.plugins['Shockwave Flash'];
 
             if (swf)
			 {
//				for (const o in swf)
//				{
//					console.warn("kubi key: " + o);
//					console.warn("kubi value: " + swf[o]);
//				}
				console.log("kubi getFlashVersion2 : " + swf.description);
                 var arr = swf.description.split(' ');
                 for (var i = 0, len = arr.length; i < len; i++)
				 {
					if(arr[i].indexOf(".") != -1)
					{
						flashVer = parseFloat(arr[i]);
						break;
					}
                 }
				 
				 //flashVer = swf.version;
             }
         }
     }
     return flashVer;
	}
	function attaLogUp(bodyData)
	{
		//阿塔平台日志上报
		var url = "https://h.trace.qq.com/kv";
		
		var httpRequest = new XMLHttpRequest();//第一步：创建需要的对象
		httpRequest.open('POST', url, true); //第二步：打开连接
		httpRequest.setRequestHeader("Content-type","application/x-www-form-urlencoded");//设置请求头 注：post方式必须设置请求头（在建立连接后设置请求头）
		httpRequest.send(bodyData);//发送请求 将情头体写在send中
		/**
		 * 获取数据后的处理程序
		 */
		httpRequest.onreadystatechange = function () {//请求后的回调接口，可将请求成功后要执行的程序写在其中
			if (httpRequest.readyState == 4 && httpRequest.status == 200)
			{//验证请求是否发送成功
				var json = httpRequest.responseText;//获取到服务端返回的数据
				console.log(json);
			}
		};
	}

{//检查flash是否正常运行了
	if(flashIsDown)

		if(!CARD.getFrom()){

		}
	}
	else
	{//flash正常运行了
		console.log("XY:flash正常运行了.");
		CARD.hideYinDaoPage();
		window.clearInterval(intervalID);
	}
}
